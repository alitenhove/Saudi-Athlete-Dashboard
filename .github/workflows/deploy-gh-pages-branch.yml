# Use this when Settings → Pages has no "GitHub Actions" option.
# After the workflow runs, set Pages to: Branch = gh-pages, Folder = / (root).

name: Build and publish to gh-pages branch

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        run: |
          npm install
          npm run build
        env:
          GITHUB_PAGES: "true"
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Deploy dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
